services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: geniebot
      POSTGRES_PASSWORD: geniebot
      POSTGRES_DB: geniebot
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geniebot"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # smtp

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      GENIEBOT_ENV: local
      DATABASE_URL: postgresql+asyncpg://geniebot:geniebot@db:5432/geniebot
      VECTOR_STORE_BACKEND: pgvector
      STORAGE_BACKEND: local
      LOCAL_S3_ROOT: /data/local_s3
      LLM_BACKEND: mock
      JIRA_BACKEND: mock
      MAIL_BACKEND: smtp
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      AUTH_BACKEND: mock
      QUEUE_BACKEND: memory
    volumes:
      - local_s3:/data/local_s3
    ports:
      - "8000:8000"

  worker:
    build: .
    command: ["python", "-m", "geniebot.worker_main"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      GENIEBOT_ENV: local
      DATABASE_URL: postgresql+asyncpg://geniebot:geniebot@db:5432/geniebot
      VECTOR_STORE_BACKEND: pgvector
      STORAGE_BACKEND: local
      LOCAL_S3_ROOT: /data/local_s3
      LLM_BACKEND: mock
      JIRA_BACKEND: mock
      MAIL_BACKEND: smtp
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      AUTH_BACKEND: mock
      QUEUE_BACKEND: memory
    volumes:
      - local_s3:/data/local_s3

  frontend:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  db_data:
  local_s3:
