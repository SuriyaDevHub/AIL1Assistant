apiVersion: v1
kind: Service
metadata:
  name: geniebot-api
  namespace: <NAMESPACE>
spec:
  selector:
    app: geniebot
    component: api
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: geniebot-frontend
  namespace: <NAMESPACE>
spec:
  selector:
    app: geniebot
    component: frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
