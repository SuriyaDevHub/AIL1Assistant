# EXAMPLE ONLY - do not apply as-is and never commit real values here.
# In a real cluster this is populated by the approved secrets manager
# (doc 2.3 "Secrets: Approved secrets manager - No credentials in code,
# config or prompts"), e.g. via an ExternalSecret / SecretStore resource
# pointing at that manager, not hand-authored like this file. This exists
# purely to document the key names each Deployment expects to be able to
# mount as env vars.
apiVersion: v1
kind: Secret
metadata:
  name: geniebot-secrets
  namespace: <NAMESPACE>
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://<user>:<password>@<host>:5432/<db>"
  OPENAM_CLIENT_ID: "<value from secrets manager>"
  OPENAM_CLIENT_SECRET: "<value from secrets manager>"
  JIRA_API_TOKEN: "<value from secrets manager>"
  JIRA_USER_EMAIL: "<value from secrets manager>"
  SMTP_USER: "<value from secrets manager>"
  SMTP_PASSWORD: "<value from secrets manager>"
