[project]
name = "geniebot"
version = "0.1.0"
description = "GenieBot L1 Assistant - event-driven agentic triage pipeline for Genie Bot batch failures"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "pgvector>=0.3.2",
    "httpx>=0.27",
    "aiosmtplib>=3.0",
    "boto3>=1.34",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "pyjwt[crypto]>=2.9",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "python-multipart>=0.0.9",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = [
    "B008",   # FastAPI's Depends(...) default-argument pattern is intentional, not a bug
    "BLE001", # health checks and outage-resilience code deliberately catch broad Exception
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
